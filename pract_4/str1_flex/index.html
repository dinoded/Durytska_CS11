<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>str1_flex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="reputation">
        <h1 class="title">A Trusted Reputation Built Over Time</h1>
        <p class="subtitle">Sample text. Click to select the text box. Click again or double click to start editing the text.</p>
        <div class="gallery">
            <div class="column">
                <img class="photo first" src="images/first.jpg" alt="Engineers at work">
                <div class="row">
                    <img class="photo second" src="images/second.jpg" alt="Builder with a clipboard">
                    <div class="stat orange">
                        <span class="stat-number">40+</span>
                        <span class="stat-label">Years Established</span>
                    </div>
                </div>
            </div>
            <div class="column">
                <div class="row">
                    <div class="stat white">
                        <span class="stat-number">10k</span>
                        <span class="stat-label">Completed Projects</span>
                    </div>
                    <img class="photo third" src="images/third.jpg" alt="Engineer with a level">
                </div>
                <img class="photo th" src="images/th.jpg" alt="Engineer at the desk">
            </div>
        </div>
        <p class="credit">Images from <a href="javascript:void(0)">Freepik</a></p>
    </section>
</body>
</html>
